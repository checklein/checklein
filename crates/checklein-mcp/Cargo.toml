[package]
name = "checklein-mcp"
description = "MCP OAuth adapter for Checklein: verifies JWT access tokens, audience, delegation chains and client identity"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
checklein-core = { path = "../checklein-core" }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
hmac = "0.13"
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
