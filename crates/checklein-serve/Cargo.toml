[package]
name = "checklein-serve"
description = "Forward-auth HTTP server for Checklein (nginx auth_request, Traefik ForwardAuth, Caddy forward_auth)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
checklein-core = { path = "../checklein-core" }
checklein-httpsig = { path = "../checklein-httpsig" }
ed25519-dalek.workspace = true
serde_json.workspace = true
tiny_http = "0.12"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
checklein-webbotauth = { path = "../checklein-webbotauth" }
checklein-mcp = { path = "../checklein-mcp" }
