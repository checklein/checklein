[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/checklein/checklein"
rust-version = "1.95"

[workspace.dependencies]
base64 = "0.23"
ed25519-dalek = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sfv = "0.16"
sha2 = "0.11"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
