# docker compose -f deploy/traefik/compose.yml up --build
# then: curl -i http://localhost:8080/ -A "ChatGPT-User/1.0"
#
# Uses Traefik's file provider (dynamic.yml) rather than Docker labels, so the
# same config works outside Docker and with any Docker Engine version.
services:
  traefik:
    image: traefik:v3.5
    command:
      - --entrypoints.web.address=:8080
      - --providers.file.filename=/etc/traefik/dynamic.yml
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./dynamic.yml:/etc/traefik/dynamic.yml:ro"]
    depends_on: [checklein, app]
  checklein:
    build: ../..
    command: ["serve", "--listen", "0.0.0.0:8787", "--trust-list", "/config/trust-list.json", "--fetch"]
    volumes: ["../../examples/trust-list.json:/config/trust-list.json:ro"]
  app:
    image: traefik/whoami:v1.10
