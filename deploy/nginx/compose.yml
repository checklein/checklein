# docker compose -f deploy/nginx/compose.yml up --build
# then: curl -i http://localhost:8080/ -A "ChatGPT-User/1.0"
services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [checklein, app]
  checklein:
    build: ../..
    command: ["serve", "--listen", "0.0.0.0:8787", "--trust-list", "/config/trust-list.json", "--fetch"]
    volumes: ["../../examples/trust-list.json:/config/trust-list.json:ro"]
  app:
    image: traefik/whoami:v1.10
