# nginx in front of your app, asking Checklein about every request (auth_request).
events {}

http {
    upstream app       { server app:80; }
    upstream checklein { server checklein:8787; }

    server {
        listen 8080;

        location / {
            auth_request /_checklein;

            # Copy Checklein's verdict onto the upstream request. proxy_set_header
            # replaces any client-sent copy.
            auth_request_set $ck_decision  $upstream_http_checklein_decision;
            auth_request_set $ck_assurance $upstream_http_checklein_assurance;
            auth_request_set $ck_operator  $upstream_http_checklein_operator;
            auth_request_set $ck_flags     $upstream_http_checklein_flags;
            auth_request_set $ck_verdict   $upstream_http_checklein_verdict;
            proxy_set_header Checklein-Decision  $ck_decision;
            proxy_set_header Checklein-Assurance $ck_assurance;
            proxy_set_header Checklein-Operator  $ck_operator;
            proxy_set_header Checklein-Flags     $ck_flags;
            proxy_set_header Checklein-Verdict   $ck_verdict;

            proxy_set_header Host $http_host;
            proxy_pass http://app;
        }

        location = /_checklein {
            internal;
            proxy_pass http://checklein/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            # $http_host keeps the port; signatures cover @authority exactly as sent.
            proxy_set_header Host              $http_host;
            proxy_set_header X-Original-URI    $request_uri;
            proxy_set_header X-Original-Method $request_method;
            # Behind TLS termination, set this to https.
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
